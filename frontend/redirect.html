<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Predicted Redirect Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel hero">
        <div>
          <p class="eyebrow">Predicted Destination</p>
          <h1>Redirected Page</h1>
          <p>This page is opened through prediction-based preloading.</p>
        </div>
      </section>

      <section class="panel">
        <article id="redirect-page-view" class="page-card">
          No preloaded page found. Go back to dashboard and load a user.
        </article>
        <div class="row">
          <button id="back-dashboard">Back To Dashboard</button>
        </div>
      </section>
    </main>

    <script src="./redirect.js"></script>
  </body>
</html>
